<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato | Move Pilates & Bem-estar</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-move.svg" />
    <link rel="stylesheet" href="assets/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/forms.css" />
    <script defer src="assets/vendor/bootstrap.bundle.min.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/store-contato.js"></script>
    <script defer src="js/contato.js"></script>
  </head>
  <body data-page="contato">
    <a class="skip-link" href="#conteudo">Conteúdo</a>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Move — Início"
          ><img
            src="assets/imagens/logo-move.svg"
            alt="Move Pilates & Bem-estar"
            width="154"
            height="62"
        /></a>
        <button
          type="button"
          class="menu-toggle"
          aria-label="Abrir menu"
          aria-controls="menu-principal"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <nav class="main-nav" id="menu-principal" aria-label="Menu principal">
          <a href="index.html" class="nav-item">Início</a
          ><a href="contato.html" class="nav-item active">Contato</a
          ><a href="login.html" class="nav-item nav-login">Entrar</a>
        </nav>
      </div>
    </header>
    <main id="conteudo">
      <section class="auth-outer">
        <div class="auth-panel contact-panel card-elevated">
          <img
            src="assets/imagens/logo-move.svg"
            alt="Move — Pilates & Bem-estar"
            class="auth-logo"
          />
          <span class="accent-line" aria-hidden="true"></span>
          <div id="contact-content">
            <div class="section-heading-tight">
              <h1>Fale com a Move</h1>
              <p>Envie sua dúvida ou mensagem para o nosso estúdio.</p>
            </div>
            <form id="contact-form" class="stack-form" novalidate>
              <div class="form-field">
                <label for="contact-name"
                  >Nome <span aria-hidden="true">*</span></label
                ><input
                  id="contact-name"
                  name="name"
                  placeholder="Digite seu nome"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="form-field">
                <label for="contact-email"
                  >E-mail <span aria-hidden="true">*</span></label
                ><input
                  id="contact-email"
                  name="email"
                  type="email"
                  placeholder="Digite seu e-mail"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="form-field">
                <label for="contact-phone"
                  >Telefone / WhatsApp <span aria-hidden="true">*</span></label
                ><input
                  id="contact-phone"
                  name="tel"
                  type="tel"
                  placeholder="(51)99999-9999"
                  autocomplete="tel"
                  maxlength="16"
                  required
                />
              </div>
              <div class="form-field">
                <label for="contact-return"
                  >Como deseja receber nosso retorno?
                  <span aria-hidden="true">*</span></label
                ><select id="contact-return" name="returnMode" required>
                  <option value="">Selecione uma opção</option>
                  <option>WhatsApp</option>
                  <option>E-mail</option>
                  <option>Ligação</option>
                </select>
              </div>
              <div class="form-field">
                <label for="contact-subject"
                  >Assunto <span aria-hidden="true">*</span></label
                ><select id="contact-subject" name="subject" required>
                  <option value="">Selecione uma opção</option>
                  <option>Elogios</option>
                  <option>Reclamações</option>
                  <option>Dúvidas</option>
                  <option>Aula de pilates</option>
                </select>
              </div>
              <div class="form-field">
                <label for="contact-message"
                  >Mensagem <span aria-hidden="true">*</span></label
                ><textarea
                  id="contact-message"
                  name="message"
                  rows="5"
                  placeholder="Digite sua mensagem aqui..."
                  required
                ></textarea>
              </div>
              <p class="form-alert" id="contact-error" role="alert" hidden></p>
              <div class="form-actions">
                <button class="btn-main" type="submit">Enviar mensagem</button
                ><a class="btn-outline" href="index.html">Voltar</a>
              </div>
            </form>
          </div>
          <div id="contact-success" class="result-panel" hidden>
            <span class="result-icon" aria-hidden="true">✓</span>
            <h2>Mensagem enviada!</h2>
            <p>Registramos sua mensagem nesta demonstração.</p>
            <a class="btn-main" href="index.html">Voltar para Home</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand-area">
          <a
            class="footer-brand"
            href="#inicio"
            aria-label="Voltar ao início da Move"
          >
            <img
              src="assets/imagens/logo-move.svg"
              alt="Move Pilates & Bem-estar"
              width="136"
              height="56"
            />
          </a>

          <nav class="footer-social" aria-label="Redes sociais">
            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram da Move"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle class="social-dot" cx="17.5" cy="6.5" r="1" />
              </svg>
            </a>

            <a
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook da Move"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M14 21v-8h3l.5-4H14V7c0-1.2.4-2 2-2h1.7V1.4C17 1.2 15.8 1 14.4 1 11.2 1 9 2.9 9 6.4V9H6v4h3v8h5Z"
                />
              </svg>
            </a>

            <a
              href="https://wa.me/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp da Move"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.5L3 20.5l1.4-4.7a8.5 8.5 0 1 1 16.1-4.1Z"
                />
                <path
                  d="M8.5 7.8c.3-.6.6-.6.9-.6h.5c.2 0 .4.1.5.4l.8 1.9c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4-.1.6.5.9 1.3 1.7 2.2 2.2.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l1.8.9c.3.1.4.3.4.5 0 .4-.2 1.2-.7 1.6-.5.5-1.2.7-1.9.6-1.1-.2-2.5-.9-3.9-2.2-1.5-1.3-2.5-2.9-2.8-4-.3-.9 0-1.7.4-2.1Z"
                />
              </svg>
            </a>
          </nav>
        </div>

        <div class="footer-info">
          <nav class="footer-links" aria-label="Links do rodapé">
            <a href="#inicio">Voltar ao início</a>
            <a href="contato.html">Fale conosco</a>
          </nav>

          <p>
            © <span id="ano-atual">2026</span> Todos os direitos reservados.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
